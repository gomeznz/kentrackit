name: Android app

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write # to publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and build
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease 2>&1 | tee /tmp/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: kentrackit-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      # A rolling release, replaced by every build, so the newest APK always has the same link.
      - name: Publish as the latest build
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk KenTrackIt.apk
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest KenTrackIt.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "KenTrackIt app: latest build" \
            --notes "Android app build ${GITHUB_RUN_NUMBER} from \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}). Upload KenTrackIt.apk in KenTrackIt Settings → Phone app; phones are then offered the update."
      # When the build fails, the log is published so it can be read without signing in to GitHub.
      - name: Publish the build log
        if: failure() && github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp /tmp/build.log android-build.log || echo "no log" > android-build.log
          find android/app/build/test-results -name '*.xml' -exec cat {} + >> android-build.log 2>/dev/null || true
          gh release delete app-build-log --yes --cleanup-tag || true
          gh release create app-build-log android-build.log --prerelease --target "$GITHUB_SHA" \
            --title "KenTrackIt app: failed build log" --notes "Log of the failed build ${GITHUB_RUN_NUMBER}."
