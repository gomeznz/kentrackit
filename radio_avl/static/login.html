<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/static/logo-mark.svg">
<meta name="theme-color" content="#0b1b33">
<title>Sign in</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/auth.css">
</head>
<body class="auth">
<canvas id="wall" aria-hidden="true"></canvas>
<main class="auth-card">
  <div class="brand">
    <img src="/static/logo-mark.svg" alt="" class="brand-mark">
    <div class="wordmark">KenTrack<i>It</i></div>
    <div class="tagline" id="a-title">Radio fleet tracking</div>
  </div>
  <form id="f">
    <label>Username <input id="u" autocomplete="username" required autofocus></label>
    <label>Password <input id="p" type="password" autocomplete="current-password" required></label>
    <label class="check"><input type="checkbox" id="r"> Keep me signed in for 30 days</label>
    <div id="err" class="err" role="alert" hidden></div>
    <button type="submit" class="primary">Sign in</button>
  </form>
  <p class="small">Use "keep me signed in" on dispatch and wall-display screens only.</p>
</main>
<script src="/static/wallpaper.js"></script>
<script>
"use strict";
KTWallpaper(document.getElementById("wall"));
(async () => {
  const $ = (id) => document.getElementById(id);
  try {
    const s = await (await fetch("/api/auth-status")).json();
    if (s.setup) location.href = "/setup";
    if (s.title && s.title !== "KenTrackIt") $("a-title").textContent = s.title;
    document.title = "Sign in · " + (s.title || "KenTrackIt");
  } catch (e) { /* offline */ }
  $("f").onsubmit = async (ev) => {
    ev.preventDefault();
    const btn = $("f").querySelector("button"); btn.disabled = true; $("err").hidden = true;
    try {
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: $("u").value, password: $("p").value, remember: $("r").checked }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || "Sign-in failed");
      const next = new URLSearchParams(location.search).get("next") || "/";
      location.href = next.startsWith("/") && !next.startsWith("//") ? next : "/";
    } catch (e) {
      $("err").textContent = e.message; $("err").hidden = false; $("p").value = ""; $("p").focus();
    } finally { btn.disabled = false; }
  };
})();
</script>
</body>
</html>
